name: Client Windows

# Compile le client de bureau Windows (.NET 8 + WebView2) et son installeur (Inno Setup) sur un serveur Windows hébergé par GitHub.
# Lancement manuel : onglet Actions → « Client Windows » → Run workflow. Les résultats sont téléchargeables (artefacts).
on:
  workflow_dispatch:
  push:
    tags: ['client-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publication (autonome, un seul fichier)
        run: >
          dotnet publish client-windows/RendezVousManager.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - name: Archive portable
        shell: pwsh
        run: Compress-Archive -Path out\RendezVousManager.exe -DestinationPath RendezVousManager-win-x64.zip
      - name: Installer Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Compiler l'installeur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc /DMyAppVersion=4.0.0 client-windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        with:
          name: RendezVousManager-win-x64
          path: RendezVousManager-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RendezVousManager-Setup
          path: installer-out/RendezVousManager-Setup-4.0.0.exe
          if-no-files-found: error
